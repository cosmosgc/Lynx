[package]
name = "lynx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
engine_content = { path = "../crates/engine_content" }
engine_net = { path = "../crates/engine_net" }
engine_sim = { path = "../crates/engine_sim" }
ron = "0.12"
serde_json = "1"

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_definition"
path = "fuzz_targets/content_definition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_manifest"
path = "fuzz_targets/content_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_decode"
path = "fuzz_targets/snapshot_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_payload"
path = "fuzz_targets/handshake_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "action_payload"
path = "fuzz_targets/action_payload.rs"
test = false
