[package]
name = "lynx_editor"
description = "Standalone content editor for Lynx projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "bevy_window",
    "bevy_winit",
    "x11",
    "2d_bevy_render",
    "bevy_pbr",
    "bevy_text",
    "default_font",
] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
engine_content.workspace = true
engine_core.workspace = true
notify = "=8.2.2"
ron.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
serde_json.workspace = true

[lints]
workspace = true
