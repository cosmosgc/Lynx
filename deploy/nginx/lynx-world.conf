# Reference Nginx TLS terminator for lynx-world. This is a standalone
# nginx.conf; merge the `http` contents into an existing configuration if needed.
events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream lynx_world {
        server 127.0.0.1:8090;
    }

    server {
        listen 443 ssl;
        server_name world.example.com;

        ssl_certificate     /etc/letsencrypt/live/world.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/world.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_header_timeout 10s;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 4k;

    # No plaintext listener/redirect is configured here. Redirect HTTP at a
    # separately managed public edge only if that edge's policy requires it.
        location = /world {
            proxy_pass http://lynx_world;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Lynx-Character $http_x_lynx_character;

        # Do not forward client-supplied identity headers. lynx-world currently
        # uses the TCP peer address for IP limits and ignores forwarded headers.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";

            proxy_read_timeout 130s;
            proxy_send_timeout 10s;
            client_max_body_size 64k;
        }
    }
}
