name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  nginx-proxy-config:
    name: Nginx proxy configuration (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Nginx and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx openssl

      - name: Validate reference proxy configuration
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/lynx-nginx-check"
          mkdir -p "$test_dir/logs"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$test_dir/privkey.pem" \
            -out "$test_dir/fullchain.pem" \
            -subj '/CN=world.example.com'
          sed \
            -e "s|/etc/letsencrypt/live/world.example.com/fullchain.pem|$test_dir/fullchain.pem|g" \
            -e "s|/etc/letsencrypt/live/world.example.com/privkey.pem|$test_dir/privkey.pem|g" \
            deploy/nginx/lynx-world.conf > "$test_dir/lynx-world.conf"
          sudo nginx -t -p "$test_dir/" -c "$test_dir/lynx-world.conf"

  prometheus-rules:
    name: Prometheus alert rules (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Prometheus tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends prometheus

      - name: Validate alert rule syntax
        run: promtool check rules deploy/prometheus/lynx-world.rules.yml

  shellcheck:
    name: Operations shell scripts (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Lint all operations shell scripts
        run: shellcheck -x scripts/*.sh

  markdown:
    name: Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Test Markdown link checker
        run: python3 scripts/test_check_markdown_links.py
      - name: Test README metadata checker
        run: python3 scripts/test_check_readme_metadata.py
      - name: Check README metadata counts
        run: python3 scripts/check_readme_metadata.py
      - name: Test release-note gate
        run: python3 scripts/test_check_release_notes.py
      - name: Check local Markdown links
        run: python3 scripts/check_markdown_links.py

  protocol-compatibility:
    name: Protocol compatibility gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out full history for the PR diff
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Require a protocol version and changelog update for wire changes
        run: >-
          python3 scripts/check_protocol_changes.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  dependency-audit:
    name: Dependency and license audit (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked

      - name: Audit locked dependencies
        run: cargo deny --locked check

  rust:
    name: Rust checks (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LYNX_PG_HOST: 127.0.0.1
      LYNX_PG_PORT: 5432
      LYNX_PG_DATABASE: lynx_ci
      LYNX_PG_TEST_DATABASE: lynx_ci_test
      LYNX_PG_USER: lynx_ci
      LYNX_PG_PASSWORD: ci-application-password
      LYNX_PG_ALLOW_INSECURE_LOOPBACK: 'true'
      LYNX_REQUIRE_POSTGRES_TEST: '1'
      LYNX_PG_SUPERUSER: postgres
      LYNX_PG_MAINTENANCE_DB: postgres
      PGPASSWORD: ci-postgres-password
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-1.99.0-

      - name: Start CI duration measurement
        run: python3 scripts/ci-job-duration.py start rust-ubuntu

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Create native application role and schema
        run: ./scripts/setup-postgres.sh

      - name: Apply migrations
        run: ./scripts/db-migrate.sh

      - name: Create and migrate isolated PostgreSQL integration database
        shell: bash
        run: |
          LYNX_PG_DATABASE="$LYNX_PG_TEST_DATABASE" ./scripts/setup-postgres.sh
          LYNX_PG_DATABASE="$LYNX_PG_TEST_DATABASE" ./scripts/db-migrate.sh

      - name: Check formatting
        run: cargo fmt --all --check

      # Keep this focused, GPU-free client verification ahead of the broad
      # workspace lint so unrelated crates cannot mask a client regression.
      - name: Test headless client (no default features)
        run: cargo test -p lynx_client --no-default-features

      - name: Build headless client (no default features)
        run: cargo build -p lynx_client --no-default-features

      - name: Smoke-test headless online client
        run: cargo test -p lynx_client --features window --test online headless_schedule_connects_moves_and_disconnects -- --exact

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run live PostgreSQL snapshot test
        shell: bash
        run: |
          test_name=postgres_store_round_trips_and_fresh_start_resets_it
          cargo test -p lynx-world --test postgres_snapshot -- --list | grep -Fx "$test_name: test"
          cargo test -p lynx-world --test postgres_snapshot -- "$test_name" --exact --nocapture

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Benchmark and gate authoritative zone tick p99
        run: cargo bench -p engine_sim --bench tick

      - name: Build workspace
        run: cargo build --workspace

      - name: Check generated CLI reference
        shell: bash
        run: |
          cargo run --quiet -p project_cli -- --json reference --output "$RUNNER_TEMP/lynx-cli-reference.md"
          diff -u docs/cli-reference.md "$RUNNER_TEMP/lynx-cli-reference.md"

      - name: Exercise generated project creator workflow
        shell: bash
        run: |
          project="$RUNNER_TEMP/lynx-generated-ci"
          cargo run --quiet -p project_cli -- --json new ci-world --output "$project" > "$RUNNER_TEMP/new-project.json"
          cargo run --quiet -p project_cli -- --json doctor --project "$project" > "$RUNNER_TEMP/doctor.json"
          jq -e '.ok == true' "$RUNNER_TEMP/doctor.json"
          cargo run --quiet -p project_cli -- --json validate --project "$project" > "$RUNNER_TEMP/validate.json"
          jq -e '.ok == true' "$RUNNER_TEMP/validate.json"
          for command in build run test; do
            cargo run --quiet -p project_cli -- --json "$command" --project "$project" > "$RUNNER_TEMP/$command.json"
            jq -e '.ok == true and .validation.ok == true and .cargo.exit_code == 0' "$RUNNER_TEMP/$command.json"
          done

      - name: Report CI duration
        if: always()
        run: python3 scripts/ci-job-duration.py finish rust-ubuntu

  windows:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-1.99.0-

      - name: Start CI duration measurement
        run: python scripts/ci-job-duration.py start rust-windows

      - name: Check formatting
        run: cargo fmt --all --check

      # Keep this focused, GPU-free client verification ahead of the broad
      # workspace lint so unrelated crates cannot mask a client regression.
      - name: Test headless client (no default features)
        run: cargo test -p lynx_client --no-default-features

      - name: Build headless client (no default features)
        run: cargo build -p lynx_client --no-default-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Report CI duration
        if: always()
        run: python scripts/ci-job-duration.py finish rust-windows

  macos:
    name: Rust checks (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-1.99.0-

      - name: Start CI duration measurement
        run: python3 scripts/ci-job-duration.py start rust-macos

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test headless client (no default features)
        run: cargo test -p lynx_client --no-default-features

      - name: Build headless client (no default features)
        run: cargo build -p lynx_client --no-default-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Report CI duration
        if: always()
        run: python3 scripts/ci-job-duration.py finish rust-macos

  migrations:
    name: PostgreSQL 17 migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LYNX_PG_HOST: 127.0.0.1
      LYNX_PG_PORT: 5432
      LYNX_PG_DATABASE: lynx_ci
      LYNX_PG_USER: lynx_ci
      LYNX_PG_PASSWORD: ci-application-password
      LYNX_PG_ALLOW_INSECURE_LOOPBACK: 'true'
      LYNX_PG_SUPERUSER: postgres
      LYNX_PG_MAINTENANCE_DB: postgres
      PGPASSWORD: ci-postgres-password
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-1.99.0-

      - name: Start CI duration measurement
        run: python3 scripts/ci-job-duration.py start migrations-postgres

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Create native application role and schema
        run: ./scripts/setup-postgres.sh

      - name: Reject an unmigrated database and report pending migrations
        shell: bash
        run: |
          LYNX_TEST_SCHEMA_SCENARIO=missing cargo test -p lynx-world --test schema_gate
          set +e
          cargo run --quiet -p project_cli -- --json doctor --backend > "$RUNNER_TEMP/doctor-missing.json"
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          migration_count=$(find server/migrations -maxdepth 1 -name '*.sql' | wc -l)
          jq -e --argjson count "$migration_count" '.backend.schema.history_missing == true and (.backend.schema.pending | length) == $count and (.backend.schema.applied | length) == 0' "$RUNNER_TEMP/doctor-missing.json"
          PGPASSWORD="$LYNX_PG_PASSWORD" psql -X -q -tA -v ON_ERROR_STOP=1 -h "$LYNX_PG_HOST" -p "$LYNX_PG_PORT" -U "$LYNX_PG_USER" -d "$LYNX_PG_DATABASE" -c "SELECT to_regclass('lynx.schema_migrations') IS NULL" | grep -Fx t

      - name: Apply migrations twice and check migration head
        shell: bash
        run: |
          ./scripts/db-migrate.sh
          history_query="SELECT version, checksum, applied_at FROM lynx.schema_migrations ORDER BY version COLLATE \"C\";"
          before="$(PGPASSWORD="$LYNX_PG_PASSWORD" psql -X -q -tA -v ON_ERROR_STOP=1 -h "$LYNX_PG_HOST" -p "$LYNX_PG_PORT" -U "$LYNX_PG_USER" -d "$LYNX_PG_DATABASE" -c "$history_query")"
          ./scripts/db-migrate.sh
          after="$(PGPASSWORD="$LYNX_PG_PASSWORD" psql -X -q -tA -v ON_ERROR_STOP=1 -h "$LYNX_PG_HOST" -p "$LYNX_PG_PORT" -U "$LYNX_PG_USER" -d "$LYNX_PG_DATABASE" -c "$history_query")"
          if [[ "$before" != "$after" ]]; then
            echo "Migration history changed on the second run" >&2
            exit 1
          fi
          ./scripts/db-migrate.sh --status
          expected="$(printf '%s\n' server/migrations/*.sql | sed 's#^.*/##; s#\.sql$##' | LC_ALL=C sort)"
          applied="$(PGPASSWORD="$LYNX_PG_PASSWORD" psql -X -q -tA -v ON_ERROR_STOP=1 -h "$LYNX_PG_HOST" -p "$LYNX_PG_PORT" -U "$LYNX_PG_USER" -d "$LYNX_PG_DATABASE" -c 'SELECT version FROM lynx.schema_migrations ORDER BY version COLLATE "C";')"
          if [[ "$applied" != "$expected" ]]; then
            echo "Applied migrations do not match repository migrations:" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$applied") >&2 || true
            exit 1
          fi

      - name: Reject newer and changed migration history
        shell: bash
        run: |
          export PGPASSWORD="$LYNX_PG_PASSWORD"
          psql_args=(-X -q -tA -v ON_ERROR_STOP=1 -h "$LYNX_PG_HOST" -p "$LYNX_PG_PORT" -U "$LYNX_PG_USER" -d "$LYNX_PG_DATABASE")
          history_query='SELECT version, checksum, applied_at FROM lynx.schema_migrations ORDER BY version COLLATE "C";'
          psql "${psql_args[@]}" -c "INSERT INTO lynx.schema_migrations(version, checksum) VALUES ('0007_future', repeat('a', 64))"
          LYNX_TEST_SCHEMA_SCENARIO=newer cargo test -p lynx-world --test schema_gate
          before="$(psql "${psql_args[@]}" -c "$history_query")"
          set +e
          cargo run --quiet -p project_cli -- --json doctor --backend > "$RUNNER_TEMP/doctor-newer.json"
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          migration_count=$(find server/migrations -maxdepth 1 -name '*.sql' | wc -l)
          jq -e --argjson count "$migration_count" '.backend.schema.unknown_count == 1 and (.backend.schema.applied | length) == $count and (.backend.schema.pending | length) == 0' "$RUNNER_TEMP/doctor-newer.json"
          test "$before" = "$(psql "${psql_args[@]}" -c "$history_query")"
          psql "${psql_args[@]}" -c "DELETE FROM lynx.schema_migrations WHERE version = '0007_future'"
          original="$(psql "${psql_args[@]}" -c "SELECT checksum FROM lynx.schema_migrations WHERE version = '0001_core'")"
          psql "${psql_args[@]}" -c "UPDATE lynx.schema_migrations SET checksum = repeat('0', 64) WHERE version = '0001_core'"
          LYNX_TEST_SCHEMA_SCENARIO=checksum cargo test -p lynx-world --test schema_gate
          before="$(psql "${psql_args[@]}" -c "$history_query")"
          set +e
          cargo run --quiet -p project_cli -- --json doctor --backend > "$RUNNER_TEMP/doctor-checksum.json"
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          jq -e '.backend.schema.checksum_mismatches == ["0001_core"]' "$RUNNER_TEMP/doctor-checksum.json"
          if ./scripts/db-migrate.sh; then
            echo 'Runner accepted a checksum mismatch' >&2
            exit 1
          fi
          test "$before" = "$(psql "${psql_args[@]}" -c "$history_query")"
          psql "${psql_args[@]}" -c "UPDATE lynx.schema_migrations SET checksum = '$original' WHERE version = '0001_core'"

      - name: Build world service for restore smoke
        run: cargo build -p lynx-world

      - name: Verify PostgreSQL backup restore and service startup
        env:
          LYNX_BACKUP_TEST_DATABASE: lynx_ci
        run: bash scripts/backup-restore-smoke.sh target/debug/lynx-world

      - name: Report CI duration
        if: always()
        run: python3 scripts/ci-job-duration.py finish migrations-postgres

  ci-history:
    name: CI duration and outcome trend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [rust, windows, macos, migrations]
    if: always()
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Report recent Rust job duration and outcome history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_HISTORY_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: python3 scripts/ci-history.py
