name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh

      - name: Generate and validate a project
        shell: bash
        run: |
          project="$RUNNER_TEMP/lynx-generated-ci"
          cargo run --quiet -p project_cli -- --json new ci-world --output "$project" > "$RUNNER_TEMP/new-project.json"
          cargo run --quiet -p project_cli -- --json doctor --project "$project" > "$RUNNER_TEMP/doctor.json"
          jq -e '.ok == true' "$RUNNER_TEMP/doctor.json"
          cargo run --quiet -p project_cli -- --json validate --project "$project" > "$RUNNER_TEMP/validate.json"
          jq -e '.ok == true' "$RUNNER_TEMP/validate.json"
          cargo check --manifest-path "$project/Cargo.toml"

  windows:
    name: Rust checks (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

  migrations:
    name: PostgreSQL 17 migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LYNX_PG_HOST: 127.0.0.1
      LYNX_PG_PORT: 5432
      LYNX_PG_DATABASE: lynx_ci
      LYNX_PG_USER: lynx_ci
      LYNX_PG_PASSWORD: ci-application-password
      LYNX_PG_SUPERUSER: postgres
      LYNX_PG_MAINTENANCE_DB: postgres
      PGPASSWORD: ci-postgres-password
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Create native application role and schema
        run: ./scripts/setup-postgres.sh

      - name: Apply migrations twice and check status
        run: |
          ./scripts/db-migrate.sh
          ./scripts/db-migrate.sh
          ./scripts/db-migrate.sh --status
          applied="$(PGPASSWORD="$LYNX_PG_PASSWORD" psql -X -q -tA -v ON_ERROR_STOP=1 -h "$LYNX_PG_HOST" -p "$LYNX_PG_PORT" -U "$LYNX_PG_USER" -d "$LYNX_PG_DATABASE" -c 'SELECT count(*) FROM lynx.schema_migrations;')"
          test "$applied" = "3"
