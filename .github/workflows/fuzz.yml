name: Fuzz

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Bounded parser fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build all fuzz targets
        run: cargo +nightly fuzz build --fuzz-dir fuzz

      - name: Run bounded fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          for target in envelope_decode frame_decode content_definition content_manifest snapshot_decode handshake_payload action_payload; do
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- \
              -max_total_time=30 \
              -timeout=2 \
              -max_len=1048576 \
              -rss_limit_mb=512
          done
