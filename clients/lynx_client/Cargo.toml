[package]
name = "lynx_client"
description = "Lynx client application foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["window"]
window = ["bevy/bevy_window", "bevy/bevy_winit", "bevy/x11", "bevy/2d_bevy_render", "bevy/bevy_ui", "bevy/bevy_ui_render", "bevy/bevy_text", "bevy/default_font", "dep:rpassword", "dep:bevy_immediate", "bevy/ui_picking", "bevy/bevy_input_focus", "bevy/bevy_ui_widgets"]
immediate-prototype = ["window"]

[dependencies]
bevy = { workspace = true, features = ["std", "async_executor"] }
bevy_immediate = { version = "=0.9.0", optional = true, default-features = false, features = ["ui", "bevy_ui_widgets"] }
engine_content.workspace = true
engine_core.workspace = true
engine_net.workspace = true
game_api.workspace = true
dotenvy.workspace = true
lynx_client_net = { path = "../lynx_client_net", version = "0.1.0" }
getrandom.workspace = true
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
semver.workspace = true
sha2.workspace = true
tokio.workspace = true
rpassword = { version = "7", optional = true }

[dev-dependencies]
futures-util = "0.3.31"
lynx_test_harness = { path = "../../tools/test_harness" }
lynx-world = { path = "../../crates/lynx_world" }
world_gateway.workspace = true
world_server.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.30.0"

[lints]
workspace = true

[[example]]
name = "interaction_ui_prototype"
required-features = ["immediate-prototype"]
